<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking API Docs</title>
  <!-- Swagger UI styles from a public CDN -->
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
  <!-- Swagger UI draws the documentation inside this element -->
  <div id="swagger-ui"></div>

  <!-- Swagger UI script and setup -->
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.addEventListener('load', function () {
      window.ui = SwaggerUIBundle({
        // openapi.json is downloaded from the running API by the CI workflow
        url: 'openapi.json',
        dom_id: '#swagger-ui',
        // This is a static docs site with no live server behind it, so hide the "Try it out" buttons
        supportedSubmitMethods: []
      });
    });
  </script>
</body>
</html>
